<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Avixzon quote intake</title>
  </head>
  <body>
    <form name="avixzon-quote" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="website">
      <input name="service">
      <input name="name">
      <input name="email" type="email">
      <input name="phone" type="tel">
      <input name="location">
      <input name="destination">
      <input name="timing">
      <textarea name="details"></textarea>
      <input name="whatsapp_followup">
    </form>
    <p><a href="/contact">Contact Avixzon</a></p>
  </body>
</html>
